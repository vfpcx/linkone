spring:
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/cangchu_dev?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&connectionCollation=utf8mb4_unicode_ci}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      connection-timeout: 20000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DB:0}
      # 本机 Memurai 无密码：不能写 password: ${REDIS_PASSWORD:}（空串会让 Redisson 发 AUTH 空密码 →
      # "ERR AUTH called without any password configured" 启动失败）。生产请在 prod profile 显式配置 password。
      timeout: 3000ms
      # D-15: lettuce.pool 已失效——连接池由 Redisson 接管（见 RedisConfig.redissonCustomizer），
      # Sa-Token / RAtomicLong 等均走 Redisson 客户端，此处 lettuce 池配置不再生效，已移除。

# X硬化 H4（11 §4）：主配已收紧为生产安全默认，dev 显式放开——SQL stdout + DEBUG + sa-token 日志。
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

sa-token:
  is-log: true
  # X硬化 H3：dev 放松闲置冻结（主配 1800s），避免调试/断点期间掉线
  active-timeout: -1

logging:
  level:
    com.cangchu: DEBUG
    com.baomidou.mybatisplus: DEBUG

cangchu:
  tenant:
    leak-detection: true
  sms:
    mock: true
    mock-code: "888888"
  # PII 硬化阶段 0：固定测试密钥（Base64("0123456789abcdef0123456789abcdef")），
  # 【仅供 dev 调试，严禁用于生产】；prod 经 PII_HMAC_KEY / PII_HMAC_KAT 环境变量注入。
  # W8-B1（V31）：AES-GCM 数据密钥 + cipher KAT 向量（固定全零 IV 加密 KAT_VECTOR 的确定性密文，
  # 以 main 裁定口径为准），同样【仅供 dev 调试】；prod 经 PII_DEK_V1 / PII_CIPHER_KAT 环境变量注入。
  pii:
    hmac-key: "MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="
    hmac-kat: "2aff2a1ede191cf2fd4af900d10f48d1e55f31e69dae59d7938c1ac349641534"
    dek-v1: "MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="
    cipher-kat: "AAAAAAAAAAAAAAAA/0CZMSIybGDfHbECcMUWmD/fMuCvrrY7Ab6B"
