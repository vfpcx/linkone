spring:
  application:
    name: cangchu-backend
  profiles:
    active: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    table: flyway_schema_history
  # P3 BE-W1（12 §4.4）：附件上传。容器层限 10MB 兜底，业务层 5MB 校验给语义化 50340
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

mybatis-plus:
  global-config:
    db-config:
      logic-delete-field: deletedAt
      logic-delete-value: "now()"
      logic-not-delete-value: "null"
  configuration:
    map-underscore-to-camel-case: true
    # X硬化 H4（11 §4）：主配=生产安全默认——显式 NoLogging（杜绝默认值漂移），杜绝 SQL+参数
    # （含手机号/密码哈希）明文进 stdout。dev 的 StdOutImpl 已移入 application-dev.yml。
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  mapper-locations: classpath*:/mapper/**/*.xml

sa-token:
  token-name: Authorization
  timeout: 28800
  # X硬化 H3（11 §3）：主配=生产安全默认——30 分钟闲置冻结（TOKEN_FREEZE→统一 401）。
  # dev/test profile 显式覆盖回 -1（调试断点/含 sleep 的存量测试不受影响）。
  active-timeout: 1800
  is-concurrent: true
  is-share: true
  token-style: tik
  # X硬化 H4：主配=生产安全默认，dev 在 application-dev.yml 放开 is-log
  is-log: false
  is-print: false

# X硬化 H4：主配日志级别按 prod 收紧（com.cangchu INFO / mybatis-plus WARN），dev 覆盖回 DEBUG。
# 生产排查 SQL 的通道 = 临时调对应 mapper 包 DEBUG（MyBatis 原生 slf4j 日志），不回开 StdOutImpl。
logging:
  level:
    com.cangchu: INFO
    com.baomidou.mybatisplus: WARN

cangchu:
  tenant:
    leak-detection: true
  # D-03: 短信 mock（万能验证码 888888）严禁在主配开启，已移出主配；
  # 仅 dev profile 的 application-dev.yml 提供 mock 开关，prod 永不放行 888888。
  sms:
    mock: false
  # PII 硬化阶段 0（15 §4）：write-mode=dual 随 V27 一同上线（同写 phone_hash/明文 + hmac 列）。
  # 回滚口径：拨回 legacy 即止血，读路径始终走旧列，与本开关无关。
  # hmac-key/hmac-kat 不进主配——dev/test 用固定测试密钥，prod 经环境变量注入（fail-fast）。
  # PII 阶段 1 Step1（15 §4 / 波次 PII-W4）：read-mode=shadow 影子双查验证期。出结果的仍是
  # 旧列，只是多用 hmac 列查一遍做比对计数（指标 pii.shadow，见 PiiShadowReader）。
  # 闸门：生产 mismatch 连续 >=7 天为 0 才可进 Step2 切读。回滚口径：拨回 plain 即停影子查询。
  pii:
    write-mode: dual
    read-mode: shadow
    # 阶段 1 Step 2/3 分模块切读灰度（15 §4）。**默认全空 = 全部回落上面的 read-mode**，
    # 也就是说本配置不改变任何现有行为；生产闸门（pricing 全量 + 入驻黑名单用例 + E2E 45×2 全绿，
    # 观察 ≥3 天）过了之后，逐块把对应环境变量置为 hmac 即可切读，置回 shadow 即秒级回滚。
    # 之所以在这里显式登记：redis-key 带连字符，不登记就没法用标准环境变量注入，
    # 「按模块灰度」也就成了纸面能力。
    # login（Step 3 / W6）与前四块口径不同——它是**双读兜底**而非硬切：hmac 未命中会回落
    # phone_hash 再查一次并异步补写，故切错不会把人挡在门外。代价是缺陷被兜底掩盖，因此另设
    # 指标 pii.fallback{verdict=FALLBACK} 承接 Step 1 的七天闸门，切读后须恒为 0（见 PiiFallbackHealer）。
    # 拨动顺序：redis-key → blacklist → sms → pricing → **login 最后**（爆炸半径最大者殿后）。
    read-modes:
      blacklist: ${PII_READ_MODE_BLACKLIST:}
      sms: ${PII_READ_MODE_SMS:}
      pricing: ${PII_READ_MODE_PRICING:}
      redis-key: ${PII_READ_MODE_REDIS_KEY:}
      login: ${PII_READ_MODE_LOGIN:}
  snowflake:
    worker-id: 1
    datacenter-id: 1

# P3 BE-W1（12 §4.4）：附件本地盘目录（演进债：P5 换 OSS，URL 结构不变）
app:
  upload-dir: ./data/uploads
