spring:
  application:
    name: cangchu-backend
  profiles:
    active: dev
  # D 波 W8-L5（13 §10）：优雅停机硬化——SIGTERM/正常停服时停止收新请求，
  # 在途请求限时完成后再关停（Windows 停服/服务管理器停止均触发 JVM shutdown hook）。
  lifecycle:
    timeout-per-shutdown-phase: 30s
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    table: flyway_schema_history
  # P3 BE-W1（12 §4.4）：附件上传。容器层限 10MB 兜底，业务层 5MB 校验给语义化 50340
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: 8080
  shutdown: graceful
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

mybatis-plus:
  global-config:
    db-config:
      logic-delete-field: deletedAt
      logic-delete-value: "now()"
      logic-not-delete-value: "null"
  configuration:
    map-underscore-to-camel-case: true
    # X硬化 H4（11 §4）：主配=生产安全默认——显式 NoLogging（杜绝默认值漂移），杜绝 SQL+参数
    # （含手机号/密码哈希）明文进 stdout。dev 的 StdOutImpl 已移入 application-dev.yml。
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  mapper-locations: classpath*:/mapper/**/*.xml

sa-token:
  token-name: Authorization
  timeout: 28800
  # X硬化 H3（11 §3）：主配=生产安全默认——30 分钟闲置冻结（TOKEN_FREEZE→统一 401）。
  # dev/test profile 显式覆盖回 -1（调试断点/含 sleep 的存量测试不受影响）。
  active-timeout: 1800
  is-concurrent: true
  is-share: true
  token-style: tik
  # X硬化 H4：主配=生产安全默认，dev 在 application-dev.yml 放开 is-log
  is-log: false
  is-print: false

# X硬化 H4：主配日志级别按 prod 收紧（com.cangchu INFO / mybatis-plus WARN），dev 覆盖回 DEBUG。
# 生产排查 SQL 的通道 = 临时调对应 mapper 包 DEBUG（MyBatis 原生 slf4j 日志），不回开 StdOutImpl。
logging:
  level:
    com.cangchu: INFO
    com.baomidou.mybatisplus: WARN

cangchu:
  tenant:
    leak-detection: true
  # D-03: 短信 mock（万能验证码 888888）严禁在主配开启，已移出主配；
  # 仅 dev profile 的 application-dev.yml 提供 mock 开关，prod 永不放行 888888。
  sms:
    mock: false
  # PII 硬化收口（16 §2.5）：W8 后无 write-mode/read-mode/read-modes 开关——写路径无条件
  # 落 hmac/cipher/last4，读路径一律走 hmac 盲索引（V33/V34 明文列已删）。
  # 密钥/KAT 不进主配：dev/test 用固定测试密钥，prod 经 PII_HMAC_KEY / PII_HMAC_KAT /
  # PII_DEK_V1 / PII_CIPHER_KAT 环境变量注入（fail-fast）。
  snowflake:
    worker-id: 1
    datacenter-id: 1

# P3 BE-W1（12 §4.4）：附件本地盘目录（演进债：P5 换 OSS，URL 结构不变）
app:
  upload-dir: ./data/uploads
