spring:
  profiles:
    active: test
  datasource:
    # W5 抖动稳定化：LOCK_TIMEOUT=10000（H2 默认行锁等待过短，并发 FOR UPDATE 用例在慢机上
    # 偶发锁超时→连接级故障，表现为 "JDBC rollback failed"/connection closed）
    url: jdbc:h2:mem:cangchu_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;LOCK_TIMEOUT=10000
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      # W5 抖动稳定化：加大测试池 + 显式等待上限（多 Spring 上下文缓存共享同一内存库，
      # 虚拟线程并发用例高峰时避免借连接饥饿）
      maximum-pool-size: 20
      connection-timeout: 30000
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    table: flyway_schema_history
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

mybatis-plus:
  global-config:
    db-config:
      logic-delete-field: deletedAt
      logic-delete-value: "now()"
      logic-not-delete-value: "null"
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

sa-token:
  token-name: Authorization
  timeout: 28800
  active-timeout: -1
  is-concurrent: true
  is-share: true
  token-style: tik
  is-log: false
  is-print: false

cangchu:
  tenant:
    leak-detection: true
  sms:
    mock: true
    mock-code: "888888"
  snowflake:
    worker-id: 9
    datacenter-id: 9
  # PII 硬化收口 + W8（V33/V34）：固定测试密钥（Base64("0123456789abcdef0123456789abcdef")），【仅供测试】。
  # W8 收口后无 write-mode/read-mode 开关——写路径无条件落 hmac/cipher/last4，
  # 读路径一律走 hmac 盲索引（V33/V34 明文列已删）。
  pii:
    hmac-key: "MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="
    hmac-kat: "2aff2a1ede191cf2fd4af900d10f48d1e55f31e69dae59d7938c1ac349641534"
    # W8-B1（V31）：AES-GCM 数据密钥 + cipher KAT 向量（固定全零 IV 加密 KAT_VECTOR 的确定性密文，
    # 以 main 裁定口径为准；与 hmac-key 同源 256-bit 测试密钥）
    dek-v1: "MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="
    cipher-kat: "AAAAAAAAAAAAAAAA/0CZMSIybGDfHbECcMUWmD/fMuCvrrY7Ab6B"

# P3 BE-W1：测试附件落到 target（随 clean 清理）
app:
  upload-dir: ./target/test-uploads
