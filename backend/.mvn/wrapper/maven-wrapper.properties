# P3b 收口 L-6：补齐 Maven Wrapper（官方 3.3.2 jar 布局）——此前 .mvn/wrapper 缺失致
# mvnw 报 ClassNotFoundException 且误绿，历轮实际以系统 mvn 执行（11 报告 §3 环境注记）。
# distribution 首跑自动下载至 ~/.m2/wrapper/dists；wrapperUrl 供 jar 丢失时自愈重下（mvnw 内 curl 兜底）。
# 本机注记：JVM 解析 repo.maven.apache.org 走 IPv6-only DNS 不通（curl 正常）——新机器首跑若
# UnknownHostException，用 curl 预下 zip 放 ~/.m2/wrapper/dists/apache-maven-3.9.9-bin/<hash>/ 即可。
wrapperVersion=3.3.2
distributionType=jar
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.9/apache-maven-3.9.9-bin.zip
wrapperUrl=https://repo.maven.apache.org/maven2/org/apache/maven/wrapper/maven-wrapper/3.3.2/maven-wrapper-3.3.2.jar
